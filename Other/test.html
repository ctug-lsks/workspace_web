<html>
    <head>
         <meta charset='utf-8'>
         <title>Child Selectors</title>
         <style type="text/css">
            ul {
                list-style: none;
            }

            ul > li {
                color: blue;
            }

            ul > li::before {
                content: "❤️ ";
            }

            ol li {
                color: red;
            }

            ol ul {
                list-style: none;
            }

            ol ul li {
                color: purple;
            }

            ol ul li::before {
                content: "🍓 ";
            }
    </style>
    </head>
    <body>
        <ul>
            <li> Item 1 </li>
            <li> Item 2 </li>
            <li> Item 3 </li>
            <ol>
                <li> Subitem 1 </li>
                <li> Subitem 2 </li>
                    <ul>
                        <li> Subsubitem 1 </li>
                        <li> Subsubitem 2 </li>
                    </ul>
                <li> Subitem 3 </li>
            </ol>
        </ul>

    </body>
    </html>
