<html>
    <head>
         <meta charset='utf-8'>
         <title>Tiêu đề trang</title>
    </head>
    <body>
        <h1>Fruits Menu</h1>
        <ol type ="1" start="5">
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
        </ol>
        <h1>Vegetables Menu</h1>
        <ul type ="square" start="1">
            <li>Carrot</li>
            <li>Broccoli</li>
            <li>Spinach</li>
        </ul>
        <h1>Mixed Menu</h1>
        <dl>
            <dt>Fruits</dt>
            <dd>Apple, Banana, Orange</dd>
            <dt>Vegetables</dt>
            <dd>Carrot, Broccoli, Spinach</dd>
        </dl>
    </body>
</html>
