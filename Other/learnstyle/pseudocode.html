        <style type="text/css">
            a:link{
                color: blue;
                text-align: center;
                font-size: 20pt;
            }
            a:visited{
                color: green;
                text-align: center;
                font-size: 20pt;
            }
            a:hover{
                color: pink;
                text-align: center;
                font-size: 15pt;
            }
            a:active{
                color: red;
                background-color: yellow;

                font-size: 20pt;
            }
            thead tr{
                color: red;

            }
            tbody tr:nth-child(2n){
                background-color: #73aaee;
            }
            tbody tr:nth-child(2n+1){
                background-color: #e5e5e5;
            }
            tbody tr:hover{
                background-color: #ffcc00;
                cursor: pointer;
            }
        </style>
