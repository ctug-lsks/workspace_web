    <head>

         <title>Tiêu đề trang</title>
    </head>
    <body>
        <div id="digital_timer" style="font-size: 30pt; text-align:center">

        </div>
        <script>
            function make_digital_timer(){
                date=new Date();
                hours=date.getHours();
                minutes=date.getMinutes();
                seconds=date.getSeconds();
                digital_timer.innerHTML=hours+":"+minutes+":"+seconds;
            }
            setInterval(make_digital_timer,1000);
            <!-- setInterval(make_digital_timer,1000) sẽ gọi hàm make_digital_timer() sau mỗi 1000ms (1 giây) để cập nhật đồng hồ kỹ thuật số. -->
