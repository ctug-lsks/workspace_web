<html>
    <head>
        <meta charset='utf-8'>
        <title>Tiêu đề trang</title>
        <style>
            @import url("css/detailcss.css");
        </style>
        <script>
            function getQueryParam(name) {
                var params = new URLSearchParams(window.location.search);
                return params.get(name) || "";
            }

            function fillStudentDetailPage() {
                document.getElementById("student_id").innerHTML = getQueryParam("id");
                document.getElementById("student_name").innerHTML = getQueryParam("name");
                document.getElementById("student_birthday").innerHTML = getQueryParam("birthday");
                document.getElementById("student_gender").innerHTML = getQueryParam("gender");
            }

            window.onload = fillStudentDetailPage;
        </script>
    </head>
    <body>
        <table>
            <tr>
                <th colspan="2">Student Information</th>
            </tr>
            <tr>
                <td>Student ID:</td>
                <td id="student_id"></td>
            </tr>
            <tr>
                <td>Student Name:</td>
                <td id="student_name"></td>
            </tr>
            <tr>
                <td>Birthday:</td>
                <td id="student_birthday"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td id="student_gender"></td>
            </tr>
        </table>
    </body>
</html>
