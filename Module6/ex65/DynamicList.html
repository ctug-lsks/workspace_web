<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exercise 65: Dynamic List</title>
  <style>
    body{font-family: 'Times New Roman', Times, serif; font-size:13px; margin:10px; color:#000}
    .sheet{width:520px}
    .controls{display:flex;flex-direction:column;gap:6px;background:transparent}
    .fn-row{display:grid;grid-template-columns:110px 1fr 140px;align-items:center;gap:8px}
    .fn-row > div:first-child{display:flex;justify-content:flex-start}
    .btn{display:inline-block;white-space:nowrap;padding:4px 8px;background:linear-gradient(#efefef,#cfcfcf);border:1px solid #9a9a9a;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);cursor:pointer;font-size:12px}
    .center-cell{display:flex;align-items:center;gap:6px}
    .label{width:60px;white-space:nowrap;font-family:inherit}
    .text-input{height:18px;padding:3px;border:1px solid #999;max-width:260px;width:100%}
    .text-input.new{max-width:300px}
    .pos-cell{display:flex;align-items:center;gap:6px}
    .pos{width:48px;height:18px;padding:2px;border:1px solid #999}
    .webnode{margin-top:10px;padding-left:6px}
    ul{margin-top:6px;margin-left:18px}
    label{font-family:inherit}
  </style>
</head>
<body>
  <div class="sheet">
    <div class="controls">
      <div class="fn-row">
        <div><button id="btnAdd" class="btn">Add Node</button></div>
        <div class="center-cell"><label class="label">Content</label><input id="addContent" class="text-input" type="text" /></div>
        <div class="pos-cell"><label class="label">Position</label><input id="addPos" class="pos" type="number" min="1" /></div>
      </div>

      <div class="fn-row">
        <div><button id="btnRemove" class="btn">Remove Node</button></div>
        <div class="center-cell"><label class="label">&nbsp;</label><input class="text-input" style="visibility:hidden"/></div>
        <div class="pos-cell"><label class="label">Position</label><input id="removePos" class="pos" type="number" min="1" /></div>
      </div>

      <div class="fn-row">
        <div><button id="btnModify" class="btn">Modify Node</button></div>
        <div class="center-cell"><label class="label">New Content</label><input id="modContent" class="text-input new" type="text" /></div>
        <div class="pos-cell"><label class="label">Position</label><input id="modPos" class="pos" type="number" min="1" /></div>
      </div>
    </div>

    <div class="webnode">
      <div>Web Node</div>
      <ul id="nodeList">
        <li>Data base</li>
        <li>Web1</li>
        <li>Web2</li>
      </ul>
    </div>
  </div>

  <script>
    const nodeList = document.getElementById('nodeList');
    function addNode(){
      const content = document.getElementById('addContent').value.trim();
      const posRaw = document.getElementById('addPos').value;
      if(!content) return;
      const li = document.createElement('li'); li.textContent = content; const items = nodeList.children; const pos = parseInt(posRaw,10);
      if(isNaN(pos) || pos>items.length) nodeList.appendChild(li);
      else if(pos<=1) nodeList.insertBefore(li, items[0]);
      else nodeList.insertBefore(li, items[pos-1]);
    }
    function removeNode(){
      const pos = parseInt(document.getElementById('removePos').value,10);
      const items = nodeList.children;
      if(isNaN(pos) || pos<1 || pos>items.length) return; nodeList.removeChild(items[pos-1]);
    }
    function modifyNode(){
      const pos = parseInt(document.getElementById('modPos').value,10);
      const newContent = document.getElementById('modContent').value.trim();
      const items = nodeList.children;
      if(isNaN(pos) || pos<1 || pos>items.length || !newContent) return; const newLi = document.createElement('li'); newLi.textContent = newContent; nodeList.replaceChild(newLi, items[pos-1]);
    }
    document.getElementById('btnAdd').addEventListener('click', addNode);
    document.getElementById('btnRemove').addEventListener('click', removeNode);
    document.getElementById('btnModify').addEventListener('click', modifyNode);
  </script>
</body>
</html>
