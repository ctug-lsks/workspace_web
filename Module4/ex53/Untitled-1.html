<html>
    <head>
        <meta charset='utf-8'>
        <title>Tiêu đề trang</title>
        <style>
            body{ font-family: Georgia, 'Times New Roman', Times, serif; }
            div.container{
                border: 1px solid #333;
                width: 760px;
                margin: 18px auto;
                padding: 8px;
                background: #fff;
            }
            table{
                width: 100%;
                border-collapse: separate;
                border-spacing: 0 6px;
            }
            thead th{
                text-align: center;
                font-weight: bold;
                font-size: 18px;
                padding: 6px 4px;
                border-bottom: 2px solid #222;
            }
            tbody td{
                padding: 6px 8px;
                vertical-align: middle;
                font-size: 16px;
            }
            /* Column widths and alignments */
            tbody td:first-child{ width: 120px; text-align: center; font-style: italic; }
            tbody td:nth-child(2){ text-align: left; padding-left: 12px; }
            tbody td:nth-child(3){ width: 110px; text-align: right; padding-right: 12px; }
            tbody td:nth-child(4){ width: 180px; text-align: center; }
            tbody td:nth-child(5){ width: 240px; text-align: center; }
            input[type="text"]{
                width: 90%;
                padding: 6px 8px;
                box-sizing: border-box;
                font-size: 14px;
            }
            /* Total row */
            .total-row{ text-align: right; }
            .total-row input[type="text"]{ width: 140px; }
        </style>
    </head>
    <body>
        <div class="container">
            <table>
                <thead>
                    <th>Part Number</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Item Table</th>
                </thead>
                <tbody>
                    <tr>
                        <td>C112</td>
                        <td>Mouse</td>
                        <td>19.95$</td>
                        <td>
                            <input type="text" name="quantity_1" required>
                        </td>
                        <td>
                            <input type="text" name="item_table_1" required>
                        </td>
                    </tr>
                    <tr>
                        <td>B124</td>
                        <td>Keyboard US</td>
                        <td>29.95$</td>
                        <td>
                            <input type="text" name="quantity_2" required>
                        </td>
                        <td>
                            <input type="text" name="item_table_2" required>
                        </td>
                    </tr>
                    <tr>
                        <td>U125</td>
                        <td>USB KingMax</td>
                        <td>39.95$</td>
                        <td>
                            <input type="text" name="quantity_3" required>
                        </td>
                        <td>
                            <input type="text" name="item_table_3" required>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5">
                            <hr size="1" color="black">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" style="text-align: right;">
                            Total: <input type="text" name="total" required><br/>
                            <label for="sum">
                                <input type="submit" name="sum" value="Sum">
                            </label>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
