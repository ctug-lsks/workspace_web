<html>
    <head>
        <meta charset='utf-8'>
        <title>Tiêu đề trang</title>
        <style>
            div{
                border: 1px solid black;
                width: 600px;
            }
            tbody{
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div>
            <form name="myForm">
                <table id="myTable">
                    <thead>
                        <th>Part Number</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Item Table</th>
                    </thead>
                    <tbody>
                        <tr>
                            <td>C112</td>
                            <td>Mouse</td>
                            <td>19.95$</td>
                            <td>
                                <input type="number" name="quantity_1"  oninput="calculateItem(1)">
                            </td>
                            <td>
                                <input type="text" name="item_table_1" readonly>
                            </td>
                        </tr>
                        <tr>
                            <td>B124</td>
                            <td>Keyboard US</td>
                            <td>29.95$</td>
                            <td>
                                <input type="number" name="quantity_2" oninput="calculateItem(2)" required>
                            </td>
                            <td>
                                <input type="text" name="item_table_2" readonly>
                            </td>
                        </tr>
                        <tr>
                            <td>U125</td>
                            <td>USB KingMax</td>
                            <td>39.95$</td>
                            <td>
                                <input type="number" name="quantity_3" oninput="calculateItem(3)" required>
                            </td>
                            <td>
                                <input type="text" name="item_table_3" readonly>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="5">
                                <hr size="1" color="black">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="5" style="text-align: right;">
                                Total: <input type="text" name="total">
                                <p></p>
                                <label for="sum">
                                    <input type="button" name="sum" value="Sum"  onclick="calculateTotal()" readonly
                                    style="width: 100px; height: 30px; background-color: orange; color: white; border-color:orange">
                                </label>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>
        <script>
            function calculateItem(i){
                qty=eval(myForm["quantity_"+i].value);
                price=myTable.rows[i].cells[2].innerHTML.replace("$", "");
                priceItem=qty*parseFloat(price);
                myForm["item_table_"+i].value=priceItem.toFixed(2)+"$";                
            }
            function calculateTotal(){
                n=myTable.rows.length;
                total=0;
                for(i=1; i<n-2; i++){
                    item=myForm["item_table_"+i].value.replace("$", "");
                    total+=parseFloat(item);
                }
                myForm["total"].value=total.toFixed(2)+"$";
            }
        </script>
    </body>
</html>
